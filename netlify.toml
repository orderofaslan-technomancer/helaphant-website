[build]
  publish = "."
  # Install Stripe SDK so the checkout function can run
  command = "npm install"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[dev]
  publish = "."
  port = 8888
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Optional: Redirects if we add more pages later
# [[redirects]]
#   from = "/admin"
#   to = "/admin.html"
#   status = 200
